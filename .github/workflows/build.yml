name: Build

on:
  push:
    branches: [ master ]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.ROS_DISTRO }} (${{ matrix.COMPILER }})
    runs-on: ubuntu-latest
    # Ubuntu 26.04 is nice-to-have for now: its jobs run, but a failure does not fail the workflow
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # one ROS 2 distribution per Ubuntu release: humble 22.04, jazzy 24.04 (lyrical 26.04 below)
        ROS_DISTRO: [humble, jazzy]
        COMPILER: [gcc, clang]
        experimental: [false]
        include:
          - { ROS_DISTRO: lyrical, COMPILER: gcc, experimental: true }
          - { ROS_DISTRO: lyrical, COMPILER: clang, experimental: true }

    steps:
      - uses: actions/checkout@v7

      - name: Build and test (colcon, in docker/Dockerfile)
        run: >
          docker build -f docker/Dockerfile
          --build-arg ROS_DISTRO=${{ matrix.ROS_DISTRO }}
          --build-arg COMPILER=${{ matrix.COMPILER }}
          .
